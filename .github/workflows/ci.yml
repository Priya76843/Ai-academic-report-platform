name: ci
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: acamedia, POSTGRES_PASSWORD: acamedia, POSTGRES_DB: acamedia_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U acamedia" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql+psycopg://acamedia:acamedia@localhost:5432/acamedia_test
      REDIS_URL: redis://localhost:6379/0
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - name: Reject UTF-8 byte-order marks
        working-directory: ${{ github.workspace }}
        run: |
          if git grep -lI "$(printf '\xEF\xBB\xBF')" -- . ; then
            echo "::error::UTF-8 BOM found in the files above. Save as plain UTF-8 (VS Code: files.encoding = utf8)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
